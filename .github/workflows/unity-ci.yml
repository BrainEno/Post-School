name: Unity CI

# Public pull requests run only the unprivileged static checks on GitHub-hosted runners.
# The Unity Editor job runs on the owner's Windows machine only for trusted main pushes
# and manual dispatches; never execute untrusted fork PR code on a self-hosted runner.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Project structure and checker verdicts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install the geometry checks' one dependency
        # tools/mesh_visibility_check.py computes triangle facing and face-mark clearance with numpy.
        # Only numpy: the proof-image scripts also use matplotlib, and they are not run in CI.
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Check the Unity project tree and pinned Editor version
        run: python3 tools/check_unity_project.py --check --github

      - name: Test the checker's own verdicts
        # unittest, not pytest: the hosted image has no pytest, and a pytest-style file is silently
        # not collected by discover. tests/ci/test_ci_ran_everything.py guards that.
        run: python3 -m unittest discover -s tests/ci -p 'test_*.py' -v

  editmode-tests:
    name: EditMode tests (local Windows Unity 6000.3.29f1)
    env:
      unityVersion: 6000.3.29f1
    # Self-hosted runners in public repositories must never run code from pull requests.
    # PRs still receive the static checks above; Unity tests run after trusted main pushes
    # or when manually dispatched by the repository owner.
    if: github.event_name != 'pull_request'
    needs: static-checks
    runs-on: [self-hosted, windows, x64, post-school-unity]
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Verify the installed Unity Editor
        shell: pwsh
        run: |
          $version = $env:unityVersion
          $key = "HKLM:\SOFTWARE\Unity Technologies\Installer\Unity $version"
          $location = (Get-ItemProperty -Path $key -ErrorAction Stop).'Location x64'
          $editor = Join-Path $location 'Editor\Unity.exe'
          if (-not (Test-Path $editor)) {
            throw "Unity Editor $version not found at $editor"
          }
          $actual = (& $editor -version | Select-Object -First 1).Trim()
          if ($actual -ne $version) {
            throw "Unity version mismatch. Expected $version; got $actual"
          }
          "Unity Editor verified: $editor ($actual)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Run EditMode tests using the machine's activated Unity Personal license
        shell: pwsh
        run: |
          $version = $env:unityVersion
          $key = "HKLM:\SOFTWARE\Unity Technologies\Installer\Unity $version"
          $location = (Get-ItemProperty -Path $key -ErrorAction Stop).'Location x64'
          $editor = Join-Path $location 'Editor\Unity.exe'
          $results = Join-Path $env:RUNNER_TEMP 'unity-editmode-results.xml'
          $log = Join-Path $env:RUNNER_TEMP 'unity-editmode.log'
          Remove-Item $results, $log -Force -ErrorAction SilentlyContinue

          $arguments = @(
            '-batchmode'
            '-nographics'
            '-projectPath'
            "`"$env:GITHUB_WORKSPACE`""
            '-runTests'
            '-testPlatform'
            'EditMode'
            '-testResults'
            "`"$results`""
            '-logFile'
            "`"$log`""
          )

          try {
            $unityProcess = Start-Process -FilePath $editor -ArgumentList $arguments -Wait -PassThru
            $unityExit = $unityProcess.ExitCode
          } catch {
            if (Test-Path $log) { Get-Content $log -Tail 200 }
            throw
          }

          if (-not (Test-Path $results)) {
            if (Test-Path $log) { Get-Content $log -Tail 200 }
            throw "Unity did not produce test results (exit code $unityExit)."
          }

          [xml]$xml = Get-Content $results -Raw
          $run = $xml.SelectSingleNode('/test-run')
          if ($null -eq $run) {
            if (Test-Path $log) { Get-Content $log -Tail 200 }
            throw 'Unity test result XML is missing the test-run root.'
          }

          $summary = @(
            '## Unity EditMode tests'
            ''
            "- Result: **$($run.result)**"
            "- Total: $($run.total)"
            "- Passed: $($run.passed)"
            "- Failed: $($run.failed)"
            "- Skipped: $($run.skipped)"
            "- Unity exit code: $unityExit"
          ) -join "`n"
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          if ($unityExit -ne 0 -or $run.result -ne 'Passed' -or [int]$run.failed -gt 0) {
            if (Test-Path $log) { Get-Content $log -Tail 200 }
            exit 1
          }

      - name: Upload Unity test results and editor log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unity-editmode-results
          path: |
            ${{ runner.temp }}/unity-editmode-results.xml
            ${{ runner.temp }}/unity-editmode.log
          if-no-files-found: warn
          retention-days: 14
