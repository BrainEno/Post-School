name: Unity CI

# Static checks always run. Unity EditMode tests run only when all Personal
# license inputs are configured; the summary explicitly reports when skipped.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Project structure and checker verdicts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check the Unity project tree and pinned Editor version
        run: python3 tools/check_unity_project.py --check --github

      - name: Test the checker's own verdicts
        run: python3 -m unittest discover -s tests/ci -p 'test_*.py' -v

  editmode-tests:
    name: EditMode tests (Unity 6000.3.29f1)
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check Unity Personal license configuration
        id: license
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "${UNITY_LICENSE}" ] && [ -n "${UNITY_EMAIL}" ] && [ -n "${UNITY_PASSWORD}" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::warning title=EditMode tests not run::Unity Personal CI requires UNITY_LICENSE, UNITY_EMAIL, and UNITY_PASSWORD secrets. Static checks ran; EditMode tests were NOT run."
          fi

      - name: Run EditMode tests
        if: steps.license.outputs.available == 'true'
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.29f1
          customImage: unityci/editor:ubuntu-6000.3.29f1-windows-mono-4
          testMode: EditMode
          artifactsPath: artifacts
          checkName: EditMode tests

      - name: Upload test results
        if: always() && steps.license.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unity-editmode-results
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Write the verdict to the step summary
        if: always()
        shell: bash
        env:
          AVAILABLE: ${{ steps.license.outputs.available }}
        run: |
          {
            echo "## Unity EditMode tests"
            if [ "${AVAILABLE}" != "true" ]; then
              echo "**NOT RUN**: Configure the three Unity Personal secrets to enable EditMode tests. Static checks ran in the other job."
            else
              echo "Unity EditMode run finished. Its outcome is recorded on the Run EditMode tests step."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
