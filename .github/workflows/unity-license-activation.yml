name: Request Unity Personal License Activation File

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-activation-file:
    name: Generate GitHub Runner activation request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate Unity activation request (.alf)
        id: activation
        uses: game-ci/unity-request-activation-file@65874ef791dae6dfa5829f1cb490eafbd7b2173c # v2

      - name: Upload activation request
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unity-personal-activation-request
          path: ${{ steps.activation.outputs.filePath }}
          if-no-files-found: error
          retention-days: 3
